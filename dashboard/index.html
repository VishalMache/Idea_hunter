<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Idea Hunter Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <header class="app-header">
      <div class="logo">
        <span class="icon">🚀</span>
        <h1>Idea Hunter</h1>
      </div>
      <div class="stats-bar" id="stats-container">
        <!-- Stats injected here -->
      </div>
    </header>

    <main class="container">
      <section class="radar-section">
        <h2>Opportunity Radar</h2>
        <div class="opportunity-grid" id="opportunity-grid">
          <div class="loading">Hunting for ideas...</div>
        </div>
      </section>
    </main>

    <!-- Modal for Problem Details -->
    <div class="modal-overlay" id="problem-modal">
      <div class="modal-content">
        <button class="close-btn" id="close-modal">&times;</button>
        <div id="modal-body" class="modal-body"></div>
        <div class="modal-actions">
          <button class="btn btn-danger" id="btn-reject">Reject Idea</button>
          <button class="btn btn-success" id="btn-accept">Accept Idea</button>
        </div>
      </div>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
