[project]
name = "idea_hunter"
version = "0.1.0"
description = "A Local Opportunity Intelligence Engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.6",
    "sqlalchemy[asyncio]>=2.0.35",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.2",
    "openai>=1.47.0",
    "google-play-scraper>=1.2.4",
    "alembic>=1.13.2",
    "ollama>=0.3.3",
    "pydantic>=2.9.1",
    "asyncpraw>=7.7.1",
    "httpx>=0.27.2",
    "pytrends>=4.9.2",
    "beautifulsoup4>=4.12.3",
    "scikit-learn>=1.5.2",
    "numpy>=2.1.1",
    "typer>=0.12.5",
    "rich>=13.8.1",
    "pydantic-settings>=2.5.2",
    "python-dotenv>=1.0.1",
    "hdbscan>=0.8.38",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
idea-hunter = "idea_hunter.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
